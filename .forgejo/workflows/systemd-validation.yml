name: Reusable systemd and Quadlet validation

on:
  workflow_call:
    inputs:
      framework_ref:
        required: true
        type: string

jobs:
  systemd:
    runs-on: octacel-org-ci
    container: docker.io/library/node:24-trixie-slim@sha256:54f84b4cf8432b21aaffd5d3ce8d41e12cea0d10d33c09d2f3c9879d49d6b446
    timeout-minutes: 15
    steps:
      - name: Install pinned checkout prerequisites
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends ca-certificates git=1:2.47.3-0+deb13u1
      - name: Check out project source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check out the pinned CI framework
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ahmed.al-zanam/octacel-ci
          ref: ${{ inputs.framework_ref }}
          path: .octacel-ci
          persist-credentials: false
      - name: Install pinned Podman and systemd validators
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends podman=5.4.2+ds1-2+b2 systemd=257.13-1~deb13u1 systemd-container=257.13-1~deb13u1 netavark=1.14.0-2 aardvark-dns=1.14.0-3
      - name: Parse Quadlet files and verify systemd unit syntax
        run: bash .octacel-ci/scripts/validate_systemd_units.sh .
